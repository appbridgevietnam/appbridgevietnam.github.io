<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>App Bridge – Ứng dụng của chúng tôi</title>

<style>
/* Apple-style typography and variables */
:root {
  --bg-color: #f5f5f7;
  --text-primary: #1d1d1f;
  --text-secondary: #86868b;
  --card-bg: rgba(255, 255, 255, 0.7);
  --blue-accent: #0071e3;
  --blue-hover: #0077ED;
}

body {
  margin: 0;
  background-color: var(--bg-color);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Glassmorphism Navigation */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(245, 245, 247, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid rgba(0, 0, 0, 0.05);
  padding: 14px 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  transform: translateY(-100%);
  opacity: 0;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
}

nav.nav-visible {
  transform: translateY(0);
  opacity: 1;
}

nav .brand {
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

/* Hero Section */
.banner-full {
  width: 100%;
  margin-bottom: 40px;
}

.banner-full img {
  width: 100%;
  height: auto;
  display: block;
}

.hero {
  max-width: 1060px;
  margin: 0 auto 40px;
  padding: 0 20px;
  text-align: center;
}

.hero h1 {
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -0.04em;
  margin: 0 0 16px 0;
}

.hero p {
  font-size: 24px;
  font-weight: 400;
  color: var(--text-secondary);
  max-width: 700px;
  margin: 0 auto 60px;
  line-height: 1.4;
  letter-spacing: -0.01em;
}

/* Apps Grid Container */
.container {
  max-width: 1060px;
  margin: auto;
  padding: 0 20px 80px;
}

.section-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 30px;
  padding-left: 10px;
}

.app-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}

/* App Store Style Cards */
.app-card {
  background: #ffffff;
  border-radius: 20px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
  cursor: pointer;
  border: none;
}

.app-card:hover {
  transform: scale(1.015);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
}

.app-card img {
  width: 80px;
  height: 80px;
  border-radius: 18px; /* Standard iOS 22.5% radius */
  object-fit: cover;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  border: 1px solid rgba(0,0,0,0.04);
}

.app-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.app-info h3 {
  margin: 0 0 4px 0;
  font-size: 17px;
  font-weight: 600;
  color: #1d1d1f;
  letter-spacing: -0.01em;
}

.app-info p {
  margin: 0;
  color: #86868b;
  font-size: 13px;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  letter-spacing: -0.01em;
}

/* "GET" Button Style */
.get-button {
  background: #f1f1f2;
  color: #0071e3;
  border-radius: 20px;
  padding: 6px 20px;
  font-size: 14px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: background 0.2s ease, opacity 0.2s ease, color 0.2s ease;
  flex-shrink: 0;
  letter-spacing: -0.01em;
}

.app-card:hover .get-button {
  background: #0071e3;
  color: #ffffff;
}

/* Footer */
footer {
  border-top: 1px solid #d2d2d7;
  padding: 40px 20px;
  text-align: center;
  font-size: 12px;
  color: var(--text-secondary);
  background: transparent;
}

footer .footer-links {
  margin-bottom: 20px;
}

footer a {
  color: #1d1d1f;
  text-decoration: none;
  margin: 0 10px;
}

footer a:hover {
  text-decoration: underline;
}

@media (max-width: 768px) {
  .hero h1 { 
    font-size: 32px; 
  }
  .hero p { 
    font-size: 16px; 
  }
  .app-list { 
    grid-template-columns: 1fr; 
    gap: 16px; 
  }
  .app-card {
    padding: 16px;
    border-radius: 18px;
    gap: 12px;
  }
  .app-card img {
    width: 64px;
    height: 64px;
    border-radius: 14px;
  }
  .app-info h3 {
    font-size: 16px;
    margin-bottom: 2px;
  }
  .app-info p {
    font-size: 13px;
    -webkit-line-clamp: 2;
  }
  .get-button {
    padding: 6px 16px;
    font-size: 13px;
  }
  nav {
    padding: 12px 16px;
  }
}
</style>
</head>

<body>

<!-- Glass Navbar -->
<nav>
  <div class="brand">
    <img src="images/common/logo.png" alt="App Bridge Logo" style="height: 32px; vertical-align: middle; margin-right: 10px; border-radius: 8px;">
    <span style="vertical-align: middle;">App Bridge</span>
  </div>
</nav>

<!-- Hero Banner -->
<div class="banner-full">
  <picture>
    <source media="(max-width: 768px)" srcset="images/common/banner-mobile.jpg">
    <img src="images/common/banner.jpg" alt="App Bridge Banner">
  </picture>
</div>

<!-- Hero Section -->
<div class="hero">
  <h1 id="heroTitle">Thiết kế cho tương lai.</h1>
  <p id="heroDesc">Khám phá các ứng dụng thông minh, tối giản, mang lại tiện ích tối đa cho cuộc sống mỗi ngày của bạn.</p>
</div>

<div class="container">
  <div class="section-title">Danh sách ứng dụng</div>
  <div class="app-list" id="appList">
    <!-- Cards will be injected here -->
  </div>
</div>

<footer>
  <div class="footer-links">
    Email: <a href="mailto:appbridgevietnam@gmail.com">appbridgevietnam@gmail.com</a> | 
    <a href="https://play.google.com/store/apps/dev?id=6205244028782286901" target="_blank">Google Play Store</a>
  </div>
  <p>&copy; 2025 App Bridge Vietnam. All rights reserved.</p>
</footer>

<script src="js/apps-data.js"></script>
<script>
// Detect Language
const userLang = navigator.language || navigator.userLanguage;
const uiLang = userLang.toLowerCase().startsWith('vi') ? 'vi' : 'en';

// Translations
const i18n = {
  vi: {
    heroTitle: "Thiết kế cho tương lai.",
    heroDesc: "Khám phá các ứng dụng thông minh, tối giản, mang lại tiện ích tối đa cho cuộc sống mỗi ngày của bạn.",
    getBtn: "TẢI VỀ",
    loading: "Đang cập nhật danh sách ứng dụng. Vui lòng chạy lệnh npm run update-apps để tải dữ liệu."
  },
  en: {
    heroTitle: "Designed for the future.",
    heroDesc: "Discover smart, minimalist apps that maximize convenience for your everyday life.",
    getBtn: "GET",
    loading: "Updating app list. Please run npm run update-apps to fetch data."
  }
};

const t = i18n[uiLang];

// Update static text
document.getElementById('heroTitle').innerText = t.heroTitle;
document.getElementById('heroDesc').innerText = t.heroDesc;

// Xử lý ẩn/hiện Navigation Bar khi cuộn trang
const nav = document.querySelector('nav');
window.addEventListener('scroll', () => {
  if (window.scrollY > 80) {
    nav.classList.add('nav-visible');
  } else {
    nav.classList.remove('nav-visible');
  }
});

const appList = document.getElementById("appList");

if (typeof APPS_DATA !== 'undefined' && APPS_DATA.length > 0) {
  APPS_DATA.forEach(app => {
    // Select app data language based on browser language
    const langData = app.locales[uiLang] || app.locales['en'] || app.locales['vi'] || {};
    
    const card = document.createElement("div");
    card.className = "app-card";

    const playStoreUrl = langData.url || `https://play.google.com/store/apps/details?id=${app.id}`;

    card.innerHTML = `
      <img src="${app.iconLocal}" alt="${langData.title || ''}">
      <div class="app-info">
        <h3>${langData.title || 'App Bridge'}</h3>
        <p>${langData.summary || ''}</p>
      </div>
      <button class="get-button" onclick="event.stopPropagation(); window.open('${playStoreUrl}', '_blank');">${t.getBtn}</button>
    `;

    card.onclick = () => {
      window.location.href = `app-detail.html?id=${app.id}`;
    };

    appList.appendChild(card);
  });
} else {
  appList.innerHTML = `<p style='grid-column: 1 / -1; text-align: center; color: #86868b; font-size: 16px; padding: 40px;'>${t.loading}</p>`;
}
</script>
</body>
</html>
